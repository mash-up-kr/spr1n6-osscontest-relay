# doc-relay 를 컨테이너로 띄우는 단독 스택.
#
# 두 가지 용도다. (1) 이미지가 실제로 DB/카프카에 붙는지 확인하는 스모크 테스트, (2) 팀 통합
# 컴포즈에 relay 서비스를 옮겨 붙일 때 베껴 갈 레퍼런스.
#
# demo/docker-compose.yml 과는 다른 물건이다. 그쪽은 릴레이를 호스트에서 ./gradlew bootRun 으로
# 띄우는 장애 주입 데모용이고, 그래서 카프카가 localhost 를 광고한다. 이 파일은 릴레이까지
# 컨테이너 안에 있으므로 컨테이너 간 통신용 리스너가 따로 필요하다.
#
# 통합 스택에서는 postgres 의 스키마를 API 서버(spr1n6-osscontest-server)의 마이그레이션이
# 만든다. 여기엔 그 서버가 없으므로 demo/seed.sql 로 대신 만든다 — 이 시드를 통합 스택에
# 가져가면 안 된다.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: docrelay
      POSTGRES_USER: docrelay
      POSTGRES_PASSWORD: docrelay
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      # initdb 는 데이터 디렉터리가 비어 있을 때만 돈다. 스키마를 다시 만들려면
      # docker compose down -v 로 볼륨을 지우고 다시 올린다.
      - ./demo/seed.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docrelay -d docrelay"]
      interval: 2s
      timeout: 5s
      retries: 15

  kafka:
    image: apache/kafka:4.0.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # 리스너가 둘인 게 이 파일의 핵심이다. 카프카는 접속해 온 클라이언트에게 "다음부터는 이
      # 주소로 와" 하고 advertised 주소를 돌려주고, 클라이언트는 그 주소로 다시 붙는다. 그래서
      # 광고 주소가 하나뿐이면 호스트와 컨테이너 중 한쪽은 반드시 깨진다:
      #   - localhost:9092 만 광고하면 → 릴레이 컨테이너가 자기 자신에게 다시 붙으려다 실패
      #   - kafka:29092 만 광고하면   → 호스트의 psql/console-consumer 가 kafka 를 못 찾음
      # 최초 연결이 성공한 뒤 실제 발행 시점에 깨지는 형태라 원인 찾기가 특히 성가시다.
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 20

  relay:
    build:
      context: .
    image: doc-relay:local
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      # 컨테이너 간 통신이므로 서비스 이름으로 붙는다. localhost 가 아니다.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/docrelay
      SPRING_DATASOURCE_USERNAME: docrelay
      SPRING_DATASOURCE_PASSWORD: docrelay
      # 호스트용 9092 가 아니라 컨테이너 간 리스너 29092 다.
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      TZ: Asia/Seoul
    ports:
      # 액추에이터: /actuator/health, /actuator/prometheus, /actuator/outbox/dead
      - "9090:9090"
    # SchemaValidator 는 outbox_event 가 기대한 형태가 아니면 기동을 중단한다. 통합 스택에서
    # 스키마를 만드는 건 API 서버의 마이그레이션이므로, 릴레이가 먼저 뜨면 한 번 죽는 게 정상이다.
    # 재시작에 맡겨 두면 스키마가 생긴 뒤 알아서 붙는다.
    restart: unless-stopped
    # 기본 10초는 정상 종료 예산(drain-timeout 30s / timeout-per-shutdown-phase 40s)보다 짧아
    # 드레인이 끝나기 전에 SIGKILL 이 날아간다.
    stop_grace_period: 45s
