# 컨테이너로 뜰 때만 필요한 설정.
#
# spring.datasource.* / spring.kafka.bootstrap-servers 는 여기 두지 않는다. 이 이미지는 어느
# 스택에 얹힐지 모르는 채로 배포되므로, 접속 정보는 띄우는 쪽이 환경변수로 넣는 게 맞다.
# (demo 프로파일이 그 값들을 직접 적는 건 호스트에서 직접 실행하는 고정된 스택이기 때문이다.)
management:
  server:
    # 기본값 127.0.0.1 은 컨테이너 안의 루프백이라, 포트를 매핑해도 밖에서 액추에이터에 닿지
    # 않는다. 컨테이너 경계와 컴포즈 네트워크가 격리를 대신하므로 여기서는 전 인터페이스에 연다.
    address: 0.0.0.0
