spring:
  application:
    name: doc-relay
  datasource:
    hikari:
      connection-timeout: 5000
      validation-timeout: 3000
      keepalive-time: 30000
      max-lifetime: 600000
  task:
    scheduling:
      pool:
        # 폴링/좀비 회수/DEAD 복구/게이지 갱신, 주기 작업이 넷이고 그중 셋이 DB를 쓴다.
        # 풀이 이보다 작으면 DB가 느려질 때 넷 다 밀리고, 최후 안전망인 폴링까지 밀린다.
        size: 4
  lifecycle:
    # relay.shutdown.drain-timeout(아래, 30초)보다 길어야 한다. 짧으면 드레인이 끝나기
    # 전에 프로세스가 먼저 강제 종료된다.
    timeout-per-shutdown-phase: 40s

server:
  port: -1 # -1은 내장 서블릿 컨테이너를 아예 띄우지 않는다는 뜻. 이 서버는 HTTP 요청을 받지 않는다.

management:
  server:
    port: 9090
    address: 127.0.0.1 # 관리 포트를 로컬호스트에만 열어 파드 밖에서 접근하지 못하게 한다.
  endpoint:
    health:
      show-details: always
      group:
        # 드레인 스레드가 죽으면 재시작으로 낫는 문제라 liveness에 넣는다. LISTEN 연결
        # 끊김은 넣지 않는다 — 폴링이 대신 동작하므로 재시작할 이유가 없다.
        liveness:
          include: drainer
        readiness:
          include: db, drainer
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, outbox

relay:
  instance-id: ${HOSTNAME:doc-relay-local}
  drain:
    batch-size: 100
  polling:
    interval: 10s
  backoff:
    base: 10s
    max: 5m
    max-attempts: 5
  dead:
    recovery-delay: 10m
    recovery-scan-interval: 5m
  zombie:
    lock-timeout: 5m
    scan-interval: 1m
  listener:
    enabled: true
    channel: outbox_event
    reconnect-base: 1s
    reconnect-max: 30s
  metrics:
    gauge-refresh-interval: 30s
  kafka:
    topic: doc.events.v1
    partitions: 3
    producer:
      max-block: 10s
      request-timeout: 30s
      delivery-timeout: 120s
      max-request-size: 1048576
  shutdown:
    drain-timeout: 30s
  admin:
    token: ${RELAY_ADMIN_TOKEN:}
